name: Unlock site

# After you have checked the repository and the last deployment are clean: mark the site as OK again and redeploy.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mark the site as ok
        run: |
          printf '{ "status": "ok", "updated": "%s" }\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > genai-leader-sprint/public/status.json
          git config user.name "site-lockdown[bot]"
          git config user.email "site-lockdown@users.noreply.github.com"
          git add genai-leader-sprint/public/status.json
          git commit -m "unlock site" || true
          git push
      - name: Re-enable Pages if it was unpublished
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow >/dev/null 2>&1 || true
      - name: Redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
